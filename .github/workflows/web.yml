name: web

on:
  pull_request:
    branches:
      - dev
      - "goal/**"
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      # Includes no-unsanitized: an unescaped value in innerHTML fails here.
      - name: Lint (ESLint)
        run: npm run lint

      # The tests read the golden snapshots in tests/golden/snapshots/ in
      # place, so a Python schema change fails this job too. No secrets.
      - name: Build (typecheck, then Vite)
        run: npm run build

      - name: Test
        run: npm test

      # Sideways scroll, chart width and touching stat values on every tab,
      # at 320 to 1440 px, light and dark (web/scripts/layout-check.mjs).
      # Builds with VITE_LANE_SERVER=1 and serves the goldens; no secrets.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Layout check
        run: npm run layout-check
