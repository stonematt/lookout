name: web

on:
  pull_request:
    branches:
      - dev
      - "goal/**"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tests read the golden snapshots in tests/golden/snapshots/ in
      # place, so a Python schema change fails this job too. No secrets.
      - name: Build (typecheck, then Vite)
        run: npm run build

      - name: Test
        run: npm test
