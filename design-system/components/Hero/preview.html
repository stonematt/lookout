<!-- @dsCard group="Overview" height=520 subtitle="The now tile: the temperature, its delta on usual, and today against the usual band" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:transparent}
:root{--type-display:7.5rem;--type-finding-lead:1.5rem;--type-finding:1.1875rem;--type-condition:1.25rem;--type-fact:2.5rem;--type-stat:1.375rem;--type-body:1rem;--type-standfirst:.875rem;--type-kicker:.8125rem;--type-source:.8125rem;--type-axis:12px;--type-label:12px;--type-annotation:13px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:12px}
.col{display:grid;gap:16px;padding:12px}
.panel{--surface:var(--ground);background:var(--ground);color:var(--ink);padding:16px;border-radius:var(--r-tile);font-family:var(--font-sans, Lexend, system-ui, sans-serif);font-size:1rem;line-height:1.55;letter-spacing:.01em;text-align:left;min-width:0}
.panel h2,.panel p,.panel dl,.panel dd{margin:0}
.theme-name{font-size:12px;color:var(--ink-3);margin:0 0 12px}
.tile{--surface:var(--tile);display:flex;flex-direction:column;min-width:0;padding:var(--tile-pad);border-radius:var(--r-tile);background:var(--surface)}
.tile+.tile{margin-top:16px}
.tile-kicker{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:var(--type-kicker);font-weight:500;line-height:1.4;color:var(--ink-3)}
.tile-finding{margin:0;font-size:var(--type-finding);font-weight:500;line-height:1.4;max-width:44ch;text-wrap:pretty}
.tile-folds{display:flex;flex-direction:column;margin-top:auto;padding-top:16px}
.fold{border-top:1px solid var(--rule);font-size:var(--type-source);line-height:1.55;color:var(--ink-3)}
.fold-line{display:block;min-height:32px;padding:6px 0;list-style:none;cursor:pointer}
.fold-line::-webkit-details-marker{display:none}
.fold-line::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;vertical-align:1px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg)}
.fold[open]>.fold-line::before{transform:translateY(-1px) rotate(45deg)}
.fold-body{padding-bottom:8px}
.ov-source{margin:0;font-size:var(--type-source);line-height:1.55;color:var(--ink-3);max-width:62ch}
.gap-hatch{background:repeating-linear-gradient(135deg,var(--hatch) 0 var(--hatch-stripe),var(--surface) var(--hatch-stripe) var(--hatch-repeat))}
.hatch-swatch{display:inline-block;flex:none;width:12px;height:12px;border-radius:var(--r-cell);vertical-align:-1px;background:repeating-linear-gradient(135deg,var(--hatch) 0 var(--hatch-chip-stripe),var(--surface) var(--hatch-chip-stripe) var(--hatch-chip-repeat))}
.hatch-chip{display:inline-flex;margin:2px 0 2px 8px;vertical-align:middle;align-items:center;gap:4px;padding:0 7px;border:1px solid var(--rule-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);font-size:var(--type-label);line-height:20px;white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tile[data-surface="now"]{--surface:var(--now-surface);--hatch:var(--ink-3)}
.now-temp{margin:0;font-size:var(--type-display);font-weight:300;line-height:.88;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.now-temp sup{font-size:.4em;vertical-align:top;position:relative;top:.15em;margin-left:2px;letter-spacing:0}
.now-delta{margin:8px 0 0;font-size:var(--type-finding);font-weight:500;line-height:1.3;color:var(--ink-2);font-variant-numeric:tabular-nums}
.today-chart{margin-top:16px}
.today-svg{display:block;width:100%;overflow:visible}
.today-band{fill:var(--temp-band)}
.today-median{fill:none;stroke:var(--ink-on-now);stroke-width:1.5;stroke-dasharray:4 3}
.today-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.today-dot{fill:var(--now);stroke:var(--surface);stroke-width:2}
.today-now{font-size:var(--type-annotation);font-weight:600;fill:var(--now);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;font-variant-numeric:tabular-nums}
.today-rain{fill:var(--ribbon-rain)}
.today-grid{stroke:var(--rule);stroke-width:1}
.today-base{stroke:var(--ink-3);stroke-width:1}
.today-tick{font-size:var(--type-axis);fill:var(--ink-3);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.today-basis{font-size:var(--type-label);fill:var(--ink-2)}
</style>
</head>
<body>
<div class="row"><section class="panel" data-theme="dark"><p class="theme-name">Dark</p><article class="tile" data-surface="now" aria-labelledby="dark-hero-k"><p class="tile-kicker sr" id="dark-hero-k">Right now</p><p class="now-temp">39.4<sup>°F</sup></p><p class="now-delta">−1° on usual for 11 pm</p><div class="today-chart"><svg class="today-svg" viewBox="0 0 360 150" role="img" aria-label="Today hour by hour against the usual band for this date: 39 degrees now, 1 degree under the usual median for 11 pm." font-family="var(--font-sans, Lexend, system-ui, sans-serif)">
<polygon class="today-band" points="0,52 40,56 80,58 120,58 160,52 200,40 240,32 280,36 320,46 360,52 360,80 320,74 280,64 240,60 200,68 160,80 120,86 80,88 40,86 0,82"/>
<line class="today-grid" x1="24" x2="360" y1="30" y2="30"/><line class="today-grid" x1="24" x2="360" y1="70" y2="70"/>
<text class="today-tick" x="0" y="34">50°</text><text class="today-tick" x="0" y="74">40°</text>
<polyline class="today-median" points="0,67 40,71 80,73 120,72 160,66 200,54 240,46 280,50 320,60 360,66"/>
<polyline class="today-line" points="0,72 40,78 80,80 120,76 160,64 200,50 240,44 280,52 320,68 332,74"/>
<circle class="today-dot" cx="332" cy="74" r="5.5"/>
<text class="today-now" x="324" y="96" text-anchor="end">now 39°</text>
<rect class="today-rain" x="150" y="104" width="4" height="6"/><rect class="today-rain" x="156" y="100" width="4" height="10"/><rect class="today-rain" x="162" y="104" width="4" height="6"/>
<line class="today-base" x1="0" x2="360" y1="110" y2="110"/>
<text class="today-tick" x="0" y="126">midnight</text><text class="today-tick" x="180" y="126" text-anchor="middle">noon</text><text class="today-tick" x="360" y="126" text-anchor="end">midnight</text>
<text class="today-basis" x="360" y="144" text-anchor="end">usual: middle half and median, earlier years</text>
</svg></div></article></section><section class="panel" data-theme="light"><p class="theme-name">Light</p><article class="tile" data-surface="now" aria-labelledby="light-hero-k"><p class="tile-kicker sr" id="light-hero-k">Right now</p><p class="now-temp">39.4<sup>°F</sup></p><p class="now-delta">−1° on usual for 11 pm</p><div class="today-chart"><svg class="today-svg" viewBox="0 0 360 150" role="img" aria-label="Today hour by hour against the usual band for this date: 39 degrees now, 1 degree under the usual median for 11 pm." font-family="var(--font-sans, Lexend, system-ui, sans-serif)">
<polygon class="today-band" points="0,52 40,56 80,58 120,58 160,52 200,40 240,32 280,36 320,46 360,52 360,80 320,74 280,64 240,60 200,68 160,80 120,86 80,88 40,86 0,82"/>
<line class="today-grid" x1="24" x2="360" y1="30" y2="30"/><line class="today-grid" x1="24" x2="360" y1="70" y2="70"/>
<text class="today-tick" x="0" y="34">50°</text><text class="today-tick" x="0" y="74">40°</text>
<polyline class="today-median" points="0,67 40,71 80,73 120,72 160,66 200,54 240,46 280,50 320,60 360,66"/>
<polyline class="today-line" points="0,72 40,78 80,80 120,76 160,64 200,50 240,44 280,52 320,68 332,74"/>
<circle class="today-dot" cx="332" cy="74" r="5.5"/>
<text class="today-now" x="324" y="96" text-anchor="end">now 39°</text>
<rect class="today-rain" x="150" y="104" width="4" height="6"/><rect class="today-rain" x="156" y="100" width="4" height="10"/><rect class="today-rain" x="162" y="104" width="4" height="6"/>
<line class="today-base" x1="0" x2="360" y1="110" y2="110"/>
<text class="today-tick" x="0" y="126">midnight</text><text class="today-tick" x="180" y="126" text-anchor="middle">noon</text><text class="today-tick" x="360" y="126" text-anchor="end">midnight</text>
<text class="today-basis" x="360" y="144" text-anchor="end">usual: middle half and median, earlier years</text>
</svg></div></article></section></div>
</body>
</html>
