<!-- @dsCard height=300 -->
<div class="cv">
  <!--
    blocks: rain-1 72w, rain-3 168w (identity), sun 96w, rain-1 48w, a hatch tail 56w in rule-strong over ground; all 204 tall (s-8*2 + s-8*0.83), corners r-sm
    arrangement: a strip of unequal bands bleeding off the right edge, the 48-hour condition ribbon as the brand composes it
    pattern: editorial, "hairlines, not shadows" -> three rule-strong hairlines crossing the strip at s-7 pitch, plus the one claret now dot (note) ringed in ground at the hatch edge
    scales: band widths from s-7/s-8 multiples, gaps 0, radius r-sm on the strip's left end, dot r 12
  -->
  <svg class="art" viewBox="0 0 960 300" aria-hidden="true">
    <defs>
      <pattern id="cvh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
        <rect class="g" width="8" height="8"/><rect class="rs" width="3" height="8"/>
      </pattern>
      <clipPath id="cvc"><rect x="512" y="48" width="460" height="204" rx="4"/></clipPath>
    </defs>
    <g clip-path="url(#cvc)">
      <rect class="r1" x="512" y="48" width="72" height="204"/>
      <rect class="r3" x="584" y="48" width="168" height="204"/>
      <rect class="sn" x="752" y="48" width="96" height="204"/>
      <rect class="r1" x="848" y="48" width="48" height="204"/>
      <rect x="896" y="48" width="64" height="204" fill="url(#cvh)"/>
    </g>
    <line class="hl" x1="480" x2="960" y1="102" y2="102"/>
    <line class="hl" x1="480" x2="960" y1="150" y2="150"/>
    <line class="hl" x1="480" x2="960" y1="198" y2="198"/>
    <circle class="nt" cx="896" cy="126" r="12"/>
  </svg>
  <div class="tx">
    <div class="nm">Lookout</div>
    <div class="tg">The Annotated Almanac: read like Dark Sky, argued like the FT.</div>
  </div>
</div>
<style>
  .cv { position: relative; width: 960px; height: 300px; background: var(--ground); overflow: hidden; font-family: var(--font-sans); }
  .art { position: absolute; inset: 0; width: 960px; height: 300px; }
  .r1 { fill: var(--rain-1); } .r3 { fill: var(--rain-3); } .sn { fill: var(--sun); }
  .g { fill: var(--ground); } .rs { fill: var(--rule-strong); }
  .hl { stroke: var(--rule-strong); stroke-width: 1; }
  .nt { fill: var(--note); stroke: var(--ground); stroke-width: 3; }
  .tx { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .nm { font-size: 104px; font-weight: 650; line-height: 0.92; letter-spacing: -0.02em; color: var(--ink); }
  .tg { margin-top: 16px; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
</style>
