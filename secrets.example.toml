# Lookout secrets: copy to ~/.config/lookout/secrets.toml and `chmod 600` it.
# Keep the real file outside the git checkout. Every name can instead be set
# as an env var of the same flat name; an env var wins over this file.
# Read by lookout/secrets_loader.py via get_secret(name).

# Ambient Weather Network (env vars of the same names)
AMBIENT_API_KEY = ""
AMBIENT_APPLICATION_KEY = ""
AMBIENT_ENDPOINT = ""

# Healthchecks.io ping key (env var HC_PING_KEY)
HC_PING_KEY = ""

# Storj S3 gateway. Env vars: STORJ_ACCESS_KEY_ID, STORJ_SECRET_ACCESS_KEY,
# STORJ_ENDPOINT_URL.
[lookout_storage_options]
ACCESS_KEY_ID = ""
SECRET_ACCESS_KEY = ""
ENDPOINT_URL = ""
